<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caleidoscopio — Herramientas de diseño</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f2efe9;
  --surface: #ffffff;
  --surface-2: #f5f2ed;
  --border: #e4e0d8;
  --border-2: #d0ccc5;
  --text: #1a1a1a;
  --text-2: #666;
  --text-3: #999;
  --radius: 10px;
  --radius-sm: 7px;
  --radius-xs: 5px;
  --header-h: 52px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
.app-header {
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  flex-shrink: 0;
  gap: 12px;
}

.back-link {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: var(--text-2);
  text-decoration: none;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  transition: background 0.12s, color 0.12s;
}
.back-link:hover { background: var(--surface-2); color: var(--text); }
.back-link svg { flex-shrink: 0; }

.header-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.2px;
}

.header-right { width: 100px; }

/* ── MAIN LAYOUT ── */
.app {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ── LEFT: scrollable controls ── */
.ctrl-panel {
  width: 288px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  background: var(--bg);
}

/* ── RIGHT: sticky preview ── */
.preview-panel {
  flex: 1;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  background: var(--bg);
  overflow: hidden;
}

/* ── Cards ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
}

.stitle {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.09em;
  margin-bottom: 10px;
}

/* ── Upload grid ── */
.ugrid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
}

.slot {
  aspect-ratio: 1;
  border: 1px dashed var(--border-2);
  border-radius: var(--radius-xs);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  overflow: hidden;
  position: relative;
  background: var(--surface-2);
  transition: border-color 0.12s;
}
.slot:hover { border-color: var(--text-3); }
.slot img { width: 100%; height: 100%; object-fit: cover; }
.slot .plus { font-size: 15px; color: var(--text-3); }
.slot .rm {
  position: absolute; top: 2px; right: 2px;
  width: 14px; height: 14px;
  background: rgba(0,0,0,.6); border-radius: 50%;
  display: none; align-items: center; justify-content: center;
  font-size: 8px; color: #fff; cursor: pointer;
}
.slot:hover .rm { display: flex; }
input[type=file] { display: none; }

/* ── Badge ── */
.badge {
  background: var(--surface-2);
  color: var(--text-3);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 10px;
  margin-left: 5px;
  border: 1px solid var(--border);
  font-weight: 400;
}

/* ── Grids ── */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

/* ── Sliders ── */
.ctrl { display: flex; flex-direction: column; gap: 3px; }
.ctrl label {
  font-size: 10px;
  color: var(--text-2);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ctrl label b {
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
input[type=range] { width: 100%; accent-color: var(--text); }

/* ── Divider ── */
hr.div { border: none; border-top: 1px solid var(--border); margin: 10px 0 8px; }

/* ── Mode pills ── */
.mrow { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.mb {
  font-size: 10px;
  padding: 3px 9px;
  border: 1px solid var(--border);
  border-radius: 20px;
  cursor: pointer;
  background: var(--surface-2);
  color: var(--text-2);
  transition: all 0.12s;
  white-space: nowrap;
}
.mb:hover { border-color: var(--text-3); }
.mb.on { background: var(--text); color: var(--surface); border-color: var(--text); }

/* ── Action buttons ── */
.acts { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }

.bp {
  background: var(--text);
  color: var(--surface);
  border: none;
  border-radius: var(--radius-sm);
  padding: 7px 13px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: opacity 0.12s;
}
.bp:hover { opacity: 0.82; }

.bs {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-sm);
  padding: 7px 11px;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: background 0.12s;
}
.bs:hover { background: var(--surface-2); }

/* ── Canvas wrap ── */
.wrap {
  background: #111;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  min-height: 0;
  width: 100%;
  overflow: hidden;
}

canvas {
  border-radius: 8px;
  max-width: 100%;
  max-height: 100%;
  display: block;
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <a href="index.html" class="back-link">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Herramientas
  </a>
  <span class="header-title">Caleidoscopio</span>
  <div class="header-right"></div>
</header>

<!-- MAIN -->
<div class="app">

  <!-- LEFT: controles -->
  <div class="ctrl-panel">

    <div class="card">
      <div class="stitle">Fotos <span class="badge" id="badge">0 / 10</span></div>
      <div class="ugrid" id="ugrid"></div>
      <input type="file" id="fi" accept="image/*" multiple>
    </div>

    <div class="card">
      <div class="stitle">Fragmentación del plano</div>
      <div class="g2">
        <div class="ctrl"><label>Segmentos <b id="vs">8</b></label><input type="range" id="seg" min="3" max="28" step="1" value="8"></div>
        <div class="ctrl"><label>Subdivisión <b id="vd">2</b></label><input type="range" id="dep" min="1" max="5" step="1" value="2"></div>
      </div>

      <hr class="div">
      <div class="stitle">Distribución aleatoria</div>
      <div class="g2">
        <div class="ctrl"><label>Offset X <b id="vrx">0</b></label><input type="range" id="rx" min="0" max="600" step="1" value="0"></div>
        <div class="ctrl"><label>Offset Y <b id="vry">0</b></label><input type="range" id="ry" min="0" max="600" step="1" value="0"></div>
        <div class="ctrl"><label>Escala <b id="vrs">0%</b></label><input type="range" id="rs" min="0" max="300" step="1" value="0"></div>
        <div class="ctrl"><label>Rotación <b id="vrr">0°</b></label><input type="range" id="rr" min="0" max="360" step="1" value="0"></div>
      </div>

      <hr class="div">
      <div class="stitle">Imagen base</div>
      <div class="g3">
        <div class="ctrl"><label>Escala <b id="vsc">1.0×</b></label><input type="range" id="sc" min="10" max="400" step="1" value="100"></div>
        <div class="ctrl"><label>X <b id="vox">0</b></label><input type="range" id="ox" min="-400" max="400" step="1" value="0"></div>
        <div class="ctrl"><label>Y <b id="voy">0</b></label><input type="range" id="oy" min="-400" max="400" step="1" value="0"></div>
      </div>
    </div>

    <div class="card">
      <div class="stitle">Animación</div>
      <div class="mrow" id="mrow">
        <div class="mb on" data-m="pulse">Pulso</div>
        <div class="mb" data-m="vortex">Vórtice</div>
        <div class="mb" data-m="explode">Explosión</div>
        <div class="mb" data-m="chaos">Caos</div>
        <div class="mb" data-m="drift">Deriva</div>
      </div>
      <div class="g3">
        <div class="ctrl"><label>Velocidad <b id="vsp">0.0</b></label><input type="range" id="sp" min="0" max="5" step="0.1" value="0"></div>
        <div class="ctrl"><label>Amplitud <b id="vam">0</b></label><input type="range" id="am" min="0" max="200" step="1" value="0"></div>
        <div class="ctrl"><label>Rotación <b id="vro">0°</b></label><input type="range" id="ro" min="0" max="360" step="1" value="0"></div>
      </div>
    </div>

    <div class="card">
      <div class="stitle">Filtros</div>
      <div class="g3">
        <div class="ctrl"><label>Blur <b id="vbl">0px</b></label><input type="range" id="bl" min="0" max="15" step="0.5" value="0"></div>
        <div class="ctrl"><label>Saturación <b id="vsa">100%</b></label><input type="range" id="sa" min="0" max="300" step="1" value="100"></div>
        <div class="ctrl"><label>Brillo <b id="vbr">100%</b></label><input type="range" id="br" min="20" max="220" step="1" value="100"></div>
      </div>
    </div>

  </div>

  <!-- RIGHT: canvas + acciones -->
  <div class="preview-panel">
    <div class="acts">
      <button class="bp" id="bplay">▶ Animar</button>
      <button class="bs" id="bshuffle">↺ Distribución</button>
      <button class="bs" id="brand">⚄ Randomizar</button>
      <button class="bs" id="bdl">↓ PNG</button>
    </div>
    <div class="wrap">
      <canvas id="kc" width="540" height="540"></canvas>
    </div>
  </div>

</div>

<script>
const SLOTS = 10;
const imgs = new Array(SLOTS).fill(null);
let curSlot = -1, mode = 'pulse';
let animating = false, animId = null, T = 0;
let pieces = [];
let distribSeed = 1;

const kc = document.getElementById('kc');
const ctx = kc.getContext('2d');
const W = kc.width, H = kc.height;
const cx = W/2, cy = H/2;
const R = Math.min(W,H)/2 - 2;

function makeRng(seed) {
  let s = seed >>> 0 || 1;
  return () => { s = Math.imul(s, 1664525) + 1013904223 >>> 0; return s / 4294967296; };
}

function buildGrid() {
  const g = document.getElementById('ugrid'); g.innerHTML='';
  for (let i=0; i<SLOTS; i++) {
    const d = document.createElement('div'); d.className='slot';
    if (imgs[i]) {
      const im = document.createElement('img'); im.src=imgs[i].src; d.appendChild(im);
      const rm = document.createElement('div'); rm.className='rm'; rm.textContent='✕';
      rm.onclick = e => { e.stopPropagation(); imgs[i]=null; buildGrid(); badge(); rebuildAndRender(); };
      d.appendChild(rm);
    } else { d.innerHTML='<span class="plus">＋</span>'; }
    d.onclick = () => { curSlot=i; document.getElementById('fi').click(); };
    g.appendChild(d);
  }
}
function badge() { document.getElementById('badge').textContent=imgs.filter(Boolean).length+' / 10'; }
document.getElementById('fi').addEventListener('change', e => {
  const files = Array.from(e.target.files);
  let si = curSlot>=0 ? curSlot : imgs.findIndex(x=>!x);
  files.forEach(f => {
    while (si<SLOTS && imgs[si]) si++; if (si>=SLOTS) return;
    const idx=si++;
    const r=new FileReader(); r.onload=ev=>{
      const im=new Image(); im.onload=()=>{ imgs[idx]=im; buildGrid(); badge(); rebuildAndRender(); };
      im.src=ev.target.result;
    }; r.readAsDataURL(f);
  });
  document.getElementById('fi').value=''; curSlot=-1;
});

const SL = {
  seg:{id:'seg',out:'vs',fmt:v=>+v}, dep:{id:'dep',out:'vd',fmt:v=>+v},
  rx:{id:'rx',out:'vrx',fmt:v=>+v}, ry:{id:'ry',out:'vry',fmt:v=>+v},
  rs:{id:'rs',out:'vrs',fmt:v=>+v+'%'}, rr:{id:'rr',out:'vrr',fmt:v=>+v+'°'},
  sc:{id:'sc',out:'vsc',fmt:v=>(v/100).toFixed(1)+'×'},
  ox:{id:'ox',out:'vox',fmt:v=>+v}, oy:{id:'oy',out:'voy',fmt:v=>+v},
  sp:{id:'sp',out:'vsp',fmt:v=>parseFloat(v).toFixed(1)},
  am:{id:'am',out:'vam',fmt:v=>+v}, ro:{id:'ro',out:'vro',fmt:v=>+v+'°'},
  bl:{id:'bl',out:'vbl',fmt:v=>+v+'px'}, sa:{id:'sa',out:'vsa',fmt:v=>+v+'%'},
  br:{id:'br',out:'vbr',fmt:v=>+v+'%'},
};
function gp(k){return parseFloat(document.getElementById(SL[k].id).value);}
Object.values(SL).forEach(s=>{
  document.getElementById(s.id).addEventListener('input',()=>{
    document.getElementById(s.out).textContent=s.fmt(document.getElementById(s.id).value);
    if (s.id==='seg'||s.id==='dep') rebuildAndRender(); else { if(!animating) render(); }
  });
});
document.getElementById('mrow').querySelectorAll('.mb').forEach(b=>{
  b.onclick=()=>{ document.querySelectorAll('#mrow .mb').forEach(x=>x.classList.remove('on')); b.classList.add('on'); mode=b.dataset.m; if(!animating) render(); };
});

function buildPieces(seed) {
  const active = imgs.filter(Boolean);
  if (!active.length) { pieces=[]; return; }
  const rng = makeRng(seed);
  const segs = Math.round(gp('seg'));
  const depth = Math.round(gp('dep'));
  const slice = (Math.PI*2)/segs;
  const half = slice/2;
  const steps = Math.max(2, Math.round(R/90));
  pieces = [];

  function addPiece(ax,ay,bx,by,px,py) {
    pieces.push({
      ax,ay,bx,by,cx:px,cy:py,
      rox: rng()-0.5, roy: rng()-0.5,
      rsc: rng()-0.5, rrot: rng()-0.5,
      imgIdx: Math.floor(rng()*active.length),
      phase: rng()*Math.PI*2, freq: 0.4+rng()*2,
      vax: rng()-0.5, vay: rng()-0.5,
      vbx: rng()-0.5, vby: rng()-0.5,
      vcx: rng()-0.5, vcy: rng()-0.5,
    });
  }

  function subdivide(ax,ay,bx,by,px,py,d) {
    if (d<=0){ addPiece(ax,ay,bx,by,px,py); return; }
    const mx=(ax+bx)/2,my=(ay+by)/2;
    const nx=(bx+px)/2,ny=(by+py)/2;
    const qx=(px+ax)/2,qy=(py+ay)/2;
    subdivide(ax,ay,mx,my,qx,qy,d-1);
    subdivide(mx,my,bx,by,nx,ny,d-1);
    subdivide(qx,qy,nx,ny,px,py,d-1);
    subdivide(mx,my,nx,ny,qx,qy,d-1);
  }

  for (let s=0; s<segs; s++) {
    const angle = s*slice + gp('ro')*Math.PI/180;
    const arcPts=[];
    for (let i=0;i<=steps;i++){
      const a=angle-half+(slice*i/steps);
      arcPts.push({x:cx+Math.cos(a)*R, y:cy+Math.sin(a)*R});
    }
    for (let i=0;i<arcPts.length-1;i++){
      subdivide(cx,cy, arcPts[i].x,arcPts[i].y, arcPts[i+1].x,arcPts[i+1].y, depth-1);
    }
  }
}

function rebuildAndRender() { buildPieces(distribSeed); if (!animating) render(); }

function render() {
  const active = imgs.filter(Boolean);
  if (!active.length || !pieces.length) {
    ctx.fillStyle='#111'; ctx.fillRect(0,0,W,H); return;
  }
  const varOx=gp('rx'), varOy=gp('ry'), varSc=gp('rs')/100, varRot=gp('rr')*Math.PI/180;
  const baseSc=gp('sc')/100, baseOx=gp('ox'), baseOy=gp('oy');
  const speed=gp('sp'), amp=gp('am'), blur=gp('bl'), sat=gp('sa')/100, bri=gp('br')/100;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const filt=(blur>0?`blur(${blur}px) `:'')+`brightness(${bri}) saturate(${sat})`;

  for (const p of pieces) {
    const img=active[p.imgIdx%active.length];
    const phi=T*speed*p.freq+p.phase;
    let dax=0,day=0,dbx=0,dby=0,dcx=0,dcy=0;
    if (amp>0&&speed>0) {
      const f=phi,f2=phi*1.3+1,f3=phi*0.7+2;
      if (mode==='pulse'){ dax=Math.sin(f)*amp*p.vax; day=Math.cos(f)*amp*p.vay; dbx=Math.sin(f2)*amp*p.vbx; dby=Math.cos(f2)*amp*p.vby; dcx=Math.sin(f3)*amp*p.vcx; dcy=Math.cos(f3)*amp*p.vcy; }
      else if (mode==='vortex'){ const t2=f+Math.PI/2; dax=Math.sin(t2)*amp*p.vax; day=Math.cos(t2)*amp*p.vay; dbx=Math.sin(t2+.7)*amp*p.vbx; dby=Math.cos(t2+.7)*amp*p.vby; dcx=Math.sin(t2+1.4)*amp*p.vcx; dcy=Math.cos(t2+1.4)*amp*p.vcy; }
      else if (mode==='explode'){ const gcx2=(p.ax+p.bx+p.cx)/3-cx,gcy2=(p.ay+p.by+p.cy)/3-cy,l=Math.hypot(gcx2,gcy2)||1,m=Math.sin(f)*amp; dax=gcx2/l*m; day=gcy2/l*m; dbx=gcx2/l*m; dby=gcy2/l*m; dcx=gcx2/l*m; dcy=gcy2/l*m; }
      else if (mode==='chaos'){ dax=Math.sin(f+p.phase)*amp*p.vax; day=Math.cos(f2)*amp*p.vay; dbx=Math.cos(f)*amp*p.vbx; dby=Math.sin(f3+p.phase)*amp*p.vby; dcx=Math.sin(f2+p.freq)*amp*p.vcx; dcy=Math.cos(f+1)*amp*p.vcy; }
      else if (mode==='drift'){ const d=Math.sin(f)*amp*0.6; dax=d*p.vax; day=d*p.vay; dbx=d*p.vbx; dby=d*p.vby; dcx=d*p.vcx; dcy=d*p.vcy; }
    }
    const ax=p.ax+dax,ay=p.ay+day,bx=p.bx+dbx,by=p.by+dby,pcx=p.cx+dcx,pcy=p.cy+dcy;
    const gcx=(ax+bx+pcx)/3,gcy=(ay+by+pcy)/3;
    const triOx=baseOx+p.rox*varOx, triOy=baseOy+p.roy*varOy;
    const triSc=baseSc*(1+p.rsc*varSc), triRot=p.rrot*varRot;

    ctx.save();
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.lineTo(pcx,pcy); ctx.closePath(); ctx.clip();
    ctx.filter=filt;
    ctx.translate(gcx,gcy); ctx.rotate(triRot);
    const iw=img.width*triSc, ih=img.height*triSc;
    ctx.drawImage(img,triOx-iw/2,triOy-ih/2,iw,ih);
    ctx.filter='none'; ctx.globalAlpha=0.13; ctx.strokeStyle='#fff'; ctx.lineWidth=0.6;
    ctx.beginPath(); ctx.moveTo(ax-gcx,ay-gcy); ctx.lineTo(bx-gcx,by-gcy); ctx.lineTo(pcx-gcx,pcy-gcy); ctx.closePath(); ctx.stroke();
    ctx.restore();
  }

  ctx.save(); ctx.globalCompositeOperation='destination-in';
  ctx.beginPath(); ctx.arc(cx,cy,R+1,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.restore();
  T+=0.016;
}

document.getElementById('bplay').onclick=()=>{
  animating=!animating;
  document.getElementById('bplay').textContent=animating?'⏸ Pausar':'▶ Animar';
  if(animating) loop(); else cancelAnimationFrame(animId);
};
function loop(){ if(!animating)return; render(); animId=requestAnimationFrame(loop); }

document.getElementById('bshuffle').onclick=()=>{ distribSeed=Math.floor(Math.random()*999999)+1; rebuildAndRender(); };

document.getElementById('brand').onclick=()=>{
  const set=(id,v)=>document.getElementById(id).value=v;
  const modes=['pulse','vortex','explode','chaos','drift'];
  mode=modes[Math.floor(Math.random()*modes.length)];
  document.querySelectorAll('#mrow .mb').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  set('seg',4+Math.floor(Math.random()*20)); set('dep',1+Math.floor(Math.random()*4));
  set('rx',Math.floor(Math.random()*500)); set('ry',Math.floor(Math.random()*500));
  set('rs',Math.floor(Math.random()*250)); set('rr',Math.floor(Math.random()*360));
  set('sc',20+Math.floor(Math.random()*250)); set('ox',Math.floor((Math.random()-.5)*300));
  set('oy',Math.floor((Math.random()-.5)*300)); set('sp',(Math.random()*3.5).toFixed(1));
  set('am',Math.floor(Math.random()*150)); set('ro',Math.floor(Math.random()*360));
  set('bl',Math.random()<.35?(Math.random()*8).toFixed(1):0);
  set('sa',60+Math.floor(Math.random()*220)); set('br',70+Math.floor(Math.random()*130));
  Object.values(SL).forEach(s=>{ document.getElementById(s.out).textContent=s.fmt(document.getElementById(s.id).value); });
  distribSeed=Math.floor(Math.random()*999999)+1; rebuildAndRender();
};

document.getElementById('bdl').onclick=()=>{
